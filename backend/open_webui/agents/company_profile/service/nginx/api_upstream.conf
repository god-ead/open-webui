upstream api_backend {
    least_conn;
    server api-gateway-1:8001 weight=1 max_fails=3 fail_timeout=30s;
    server api-gateway-2:8002 weight=1 max_fails=3 fail_timeout=30s;
    server api-gateway-3:8003 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream company_profile_file_server {
    server file-server:8010 max_fails=3 fail_timeout=30s;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    location /api/download/ {
        proxy_pass http://company_profile_file_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_unavailable;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_unavailable;
    }

    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /monitor/api/ {
        proxy_pass http://monitor:8089/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location /monitor/ {
        proxy_pass http://monitor:8089/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location @service_unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"error": "服务暂不可用", "retry_after": 30}';
    }
}
