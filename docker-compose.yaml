services:
  # Open WebUI 主服务容器。
  # 作用：运行构建后的前端静态资源与 FastAPI 后端，容器内监听 8080。
  # 当前配置不启动内置/本地 Ollama
  open-webui:
    # 从当前目录的 Dockerfile 构建生产镜像。
    build:
      context: .
      dockerfile: Dockerfile
    # 固定使用本地构建镜像。
    image: sales-chatbot-image:local
    container_name: sales-chatbot-test
    # 将运行期变量从 .env 注入 open-webui 容器
    env_file:
      - .env
    # 持久化 Open WebUI 数据，并保存首次启动自动生成的 WEBUI_SECRET_KEY
    volumes:
      - sales-chatbot:/app/backend/data
    ports:
      # 宿主机端口:容器端口。
      - 0.0.0.0:3031:8080
    extra_hosts:
      # 允许容器通过 host.docker.internal 访问宿主机服务。
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  sales-chatbot:
    name: sales-chatbot
